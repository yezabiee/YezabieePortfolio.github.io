<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Prototype Layout</title>
  <link rel="stylesheet" href="bottommydeisavior.css" />
</head>
<body class="works-page">
  <div class="wrapper works-page-shell">


  <!-- Top Navigation -->
  <div class="navbar">
    <a href="index.html">PROFILE</a>

    <a href="WORKS.html">PORTFOLIO</a>
    <a href="SOCIALS.html">SOCIALS</a>

  <div class="container">

    <!-- Sidebar -->
   <div class="sidebar">
    <div class="pfp">  <img src="pfp.jpg" alt="Profile Picture" style="width: 100%; height: 100%; border-radius: 50%; border-color: #8aa88d; border-style: solid;" />
    </div>
      <div class="more-wrapper">
         <button onclick="toggleSubmenu(this)" class="more-btn">ORIGINAL ILLUSTRATIONS</button>
         <div class="submenu">
              <button onclick="showTab('dig')">DIGITAL</button>
          </div>
        </div>
        <div class="more-wrapper">
            <button onclick="toggleSubmenu(this)" class="more-btn">FANARTS</button>
            <div class="submenu">
                <button onclick="showTab('digital')">DIGITAL</button>
            </div>
        </div>
        <button onclick="showTab('animations')">ANIMATIONS</button>
        <div class="more-wrapper">
            <button onclick="toggleSubmenu(this)" class="more-btn">OTHER NOTABLE WORKS</button>
            <div class="submenu">
                <button onclick="showTab('cooche')">CROCHET PRODUCTS</button>
                <button onclick="showTab('miscer')">MA105</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content works-content-scroll">
        <div id="welcome">
        </div>


    <div id="trad" style="display:none;">
    </div>

    <div id="dig" style="display:none;" class="work-thumb-grid">
      <button type="button" class="work-thumb" data-title="Unnamed OC" data-desc="Describe this piece here.">
        <img src="Unknamed OC_20240825003928.jpg" alt="Digital Original Compilation" />
      </button>
      <button type="button" class="work-thumb" data-title="Frog study" data-desc="Describe this piece here.">
        <img src="Frog but it only has back legs.jpg" alt="Digital Original Compilation 2" />
      </button>
    </div>

    <div id="animations" style="display:none;" class="work-thumb-grid">
      <button type="button" class="work-thumb" data-title="Teto GIF" data-desc="Describe this animation here.">
        <img src="Tetogif.gif" alt="Sample Animation" />
      </button>
      <button type="button" class="work-thumb work-thumb--video" data-title="Floating" data-desc="Describe this video here.">
        <video preload="metadata" muted playsinline>
          <source src="Floating.mp4" type="video/mp4">
        </video>
      </button>
    </div>

    <div id="cooche" style="display:none;" class="work-thumb-grid">
      <button type="button" class="work-thumb" data-title="Sunflower bouquet" data-desc="Describe this crochet piece here.">
        <img src="sunflwr bq crochet.jpg" alt="Crochet Product 1" />
      </button>
      <button type="button" class="work-thumb" data-title="Jellyfish" data-desc="Describe this crochet piece here.">
        <img src="Jellyfish.jpg" alt="Crochet Product 2" />
      </button>
      <button type="button" class="work-thumb" data-title="Scrunchies" data-desc="Describe this crochet piece here.">
        <img src="scrunchies.jpg" alt="Crochet Product 3" />
      </button>
      <button type="button" class="work-thumb" data-title="Sunflower" data-desc="Describe this crochet piece here.">
        <img src="sunflwr.jpg" alt="Crochet Product 4" />
      </button>
    </div>
    
    <div id="miscer" style="display:none;" class="work-thumb-grid">
      <button type="button" class="work-thumb" data-title="Cyrene cover" data-desc="A character from Honkai Star Rail named Cyrene as a magazine cover.">
        <img src="cyrene cover.jpg" alt="Miscellaneous Work" />
      </button>
      <button type="button" class="work-thumb" data-title="Logo mockup" data-desc="Tote bag mockup for my personal logo I designed.">
        <img src="logo mockup.JPG" alt="Logo mockup" />
      </button>
      <button type="button" class="work-thumb" data-title="Grapes" data-desc="Grapes made in Adobe Illustrator.">
        <img src="grapes.png" alt="Grapes illustration" />
      <button type="button" class="work-thumb" data-title="Heart poster" data-desc="A blood donation poster that I redesigned.">
        <img src="heartposter.jpg" alt="Heart poster" />
       <button type="button" class="work-thumb" data-title="Vision board" data-desc="Vision board of all the things I cherish the most.">
        <img src="visionboard.jpg" alt="Vision board" />
      </button>
      </button>
      </button>
    </div>
</div>
</div>
</div>

  <div id="work-detail" class="work-detail" aria-hidden="true">
    <div class="work-detail__backdrop" data-work-detail-close></div>
    <div class="work-detail__panel" role="dialog" aria-modal="true" aria-labelledby="work-detail-title">
      <button type="button" class="work-detail__close" aria-label="Close" data-work-detail-close>&times;</button>
      <div class="work-detail__media"></div>
      <div class="work-detail__copy">
        <h2 id="work-detail-title" class="work-detail__title"></h2>
        <p class="work-detail__desc"></p>
      </div>
    </div>
  </div>

</body>
